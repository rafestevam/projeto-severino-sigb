events {}

http {
    # ─── Rate limiting (OPAC, ST-08) ─────────────────────────────────────────────
    # Endpoints públicos, sem login. O pré-cadastro tem limite apertado para evitar
    # enumeração de CPF via 409 e cadastros em massa; o catálogo é mais folgado
    # para suportar a busca "em tempo real".
    #
    # Só o POST /api/leitores conta para o limite de cadastro: chave vazia não é
    # contabilizada, e GET /api/leitores?cpf= é rota autenticada do balcão.
    map $request_method $opac_cadastro_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $opac_cadastro_key  zone=opac_cadastro:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=opac_catalogo:10m rate=10r/s;
    limit_req_status 429;

    # ─── Upstreams ───────────────────────────────────────────────────────────────
    upstream api {
        server api:8000;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    # ─── HTTP → HTTPS redirect (port 80) ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ─── HTTPS (port 443) ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        # Self-signed certificate (dev only — replaced by Certbot in ST-09/US-031)
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── SPA Vue (/) ───────────────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── OPAC: pré-cadastro público (POST /api/leitores) ───────────────────────
        location = /api/leitores {
            limit_req          zone=opac_cadastro burst=3 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── OPAC: catálogo público (/api/obras/publico e /api/obras/{id}/publico) ─
        location ~ ^/api/obras/([0-9a-fA-F-]+/)?publico$ {
            limit_req          zone=opac_catalogo burst=20 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── FastAPI (/api) ─────────────────────────────────────────────────────────
        location /api {
            proxy_pass         http://api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # ── Keycloak (/auth) ───────────────────────────────────────────────────────
        location /auth {
            proxy_pass         http://keycloak;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Keycloak can take longer on cold boot
            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
        }
    }
}
