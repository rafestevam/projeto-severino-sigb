[pytest]
asyncio_mode = auto
markers =
    integration: testes de integração que requerem banco de dados e a app FastAPI via ASGI
    e2e: alias para testes de integração fim-a-fim (mesmo conjunto que integration)
    static: testes de análise estática que não requerem banco de dados
    asyncio: marca testes como assíncronos (gerenciado pelo pytest-asyncio)
